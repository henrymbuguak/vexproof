[project]
name = "vexproof"
version = "0.1.0"
description = "Evidence-backed vulnerability triage: which dependency CVEs actually reach your code. The AI proposes. The verifier proves."
readme = "README.md"
authors = [{ name = "Henry Mbugua" }]
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    "cvss>=3.6",
    "httpx>=0.28.1",
    "openai>=3.39.0",
    "packaging>=26.3",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "stamina>=26.1.0",
    "structlog>=26.1.0",
    "typer>=0.27.3",
    "unidiff>=1.0.1",
]

[project.scripts]
vexproof = "vexproof.cli:app"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.12",
    "mypy>=2.4.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "respx>=0.23.1",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20260906",
]
web = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# Fixture repos are analysis targets, not project code. eval/dynamic runs inside the target
# project's own old interpreter (Python 3.8), so it is not held to this project's py312 rules.
extend-exclude = ["tests/fixtures", "eval/dynamic"]
force-exclude = true  # also when pre-commit passes excluded files by name

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "PT", "ANN", "N", "C4", "PL", "TRY", "PTH"]
ignore = [
  "PLR0913",  # pipeline functions take explicit collaborators by design
  "TRY003",   # contextual messages on typed exceptions are intended
]

[tool.ruff.lint.per-file-ignores]
"src/vexproof/cli.py" = ["PLR0917"]  # Typer maps each option to a function parameter
"tests/**" = ["S101", "ANN", "PLR2004", "S105", "S106", "PLC0415"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
exclude = ["^tests/fixtures/"]

[[tool.mypy.overrides]]
module = ["cvss.*", "unidiff.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --strict-config -m 'not network and not llm'"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "network: hits real external services (skipped by default and in CI)",
  "llm: calls a real model API (skipped by default and in CI)",
]
filterwarnings = ["error"]

[tool.coverage.run]
source = ["vexproof"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]
