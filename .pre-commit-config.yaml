# Hooks run the same tool versions as the lockfile by calling them through uv.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0  # run `pre-commit autoupdate` once, then pin
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0  # run `pre-commit autoupdate` once, then pin
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
